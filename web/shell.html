<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- PAPERMARCH in a browser (scripts/build-web.ps1 builds it into build/web/site, scripts/serve-web.ps1 serves it).
     A phone held upright gets the whole screen, notch and home bar included (the game keeps its controls out of them:
     the safe area comes from env(safe-area-inset-*) through the CSS variables below); a wider screen gets a column. -->
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="PAPERMARCH">
<meta name="theme-color" content="#45281b">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<title>PAPERMARCH</title>
<style>
  :root {
    --sat: env(safe-area-inset-top, 0px);
    --sar: env(safe-area-inset-right, 0px);
    --sab: env(safe-area-inset-bottom, 0px);
    --sal: env(safe-area-inset-left, 0px);
  }
  html, body {
    margin: 0;
    height: 100%;
    overflow: hidden;
    background: #5a3822;
    overscroll-behavior: none;
    touch-action: none;
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent;
    -webkit-text-size-adjust: 100%;
  }
  body {
    position: fixed;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  /* Upright phone: all of it. Anything wider: a column no wider than 3:4, the game's widest layout. */
  #canvas {
    display: block;
    height: 100%;
    width: min(100vw, 75vh);
    width: min(100vw, 75dvh);
    outline: none;
    touch-action: none;
  }
  #status, #turn {
    position: fixed;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 24px;
    box-sizing: border-box;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  #status { pointer-events: none; }
  #status .name { color: #f03a4c; font-size: 40px; font-weight: 900; letter-spacing: 2px; background: #fff4d6; padding: 14px 26px; border-radius: 18px; box-shadow: 0 8px 18px rgba(38,20,10,0.45); }
  #status #msg { color: #fff4d6; font-size: 16px; font-weight: 600; margin-top: 16px; max-width: 420px; line-height: 1.4; }
  #turn { display: none; background: #5a3822; color: #ffffff; font-size: 20px; font-weight: 700; z-index: 2; }
  @media (orientation: landscape) and (max-height: 520px) and (pointer: coarse) {
    #turn { display: flex; }
  }
  #hint {
    display: none; position: fixed; z-index: 3; bottom: calc(var(--sab) + 14px); left: 50%; transform: translateX(-50%);
    padding: 8px 16px; border-radius: 18px; background: rgba(38, 20, 10, 0.85); color: #fff4d6; white-space: nowrap;
    font: 600 14px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; pointer-events: none; transition: opacity 1s;
  }
</style>
</head>
<body>
<canvas id="canvas" tabindex="-1"></canvas>
<div id="status"><div class="name">PAPERMARCH</div><div id="msg">Loading&hellip;</div></div>
<div id="turn">Turn your phone upright to play</div>
<div id="hint">For full screen: Share, then Add to Home Screen</div>
<script>
  // ?args=--level%2012 passes the game its command line (TECH_SPEC 2.5): tests on a PC use ?args=--no-audio.
  var params = new URLSearchParams(location.search);
  function show(text) {
    document.getElementById('status').style.display = 'flex';
    document.getElementById('msg').textContent = text;
  }
  var Module = {
    canvas: document.getElementById('canvas'),
    arguments: params.has('args') ? params.get('args').split(/\s+/).filter(Boolean) : [],
    print: function (text) { console.log(text); },
    printErr: function (text) { console.warn(text); },
    onAbort: function (what) { show('PAPERMARCH stopped (' + what + '). Reload the page to try again.'); }
  };
  if (!document.createElement('canvas').getContext('webgl2')) {
    show('This browser has no WebGL 2, which PAPERMARCH needs. Safari on iOS 15 or later, or a recent Chrome, Edge or Firefox, has it.');
  }
  // The game calls this once its first level is ready (platform::webReady).
  window.pmReady = function () { document.getElementById('status').style.display = 'none'; };

  // Sound: a browser starts its audio only inside a touch, a click or a key, and iOS stops it when the page is left, so
  // every such gesture resumes it. The screen stays on while the game is in front (where the browser lets it).
  var wake = null;
  function gesture() {
    var sdl = Module['SDL3'];
    var ctx = sdl && sdl.audioContext;
    if (ctx && ctx.state !== 'running') ctx.resume();
    if (navigator.wakeLock && !wake && document.visibilityState === 'visible') {
      navigator.wakeLock.request('screen').then(function (w) {
        wake = w;
        w.addEventListener('release', function () { wake = null; });
      }).catch(function () {});
    }
  }
  ['touchend', 'pointerup', 'mousedown', 'keydown'].forEach(function (type) {
    window.addEventListener(type, gesture, true);
  });
  // Full screen on a phone (the owner, 2026-11-27: the address bar is in the way in a web app): a touch screen enters it
  // at the first touch, and again after leaving it, held upright where the browser allows. Android's Chrome and iPads
  // have the Fullscreen API; an iPhone's Safari has none for a page, so it gets a hint toward the home screen, where the
  // page opens without the bar (manifest.webmanifest, apple-mobile-web-app-capable).
  var touchScreen = matchMedia('(pointer: coarse)').matches;
  var standalone = navigator.standalone || matchMedia('(display-mode: fullscreen), (display-mode: standalone)').matches;
  var root = document.documentElement;
  function fullscreen() {
    if (!touchScreen || standalone || document.fullscreenElement || document.webkitFullscreenElement) return;
    var req = root.requestFullscreen || root.webkitRequestFullscreen;
    if (!req) return;
    var p = req.call(root, { navigationUI: 'hide' });
    if (p && p.then) p.then(function () {
      if (screen.orientation && screen.orientation.lock) screen.orientation.lock('portrait').catch(function () {});
    }).catch(function () {});
  }
  if (touchScreen && !standalone && !(root.requestFullscreen || root.webkitRequestFullscreen)) {
    var hint = document.getElementById('hint');
    hint.style.display = 'block';
    setTimeout(function () { hint.style.opacity = '0'; }, 7000);
    setTimeout(function () { hint.style.display = 'none'; }, 8000);
  }
  window.addEventListener('touchend', fullscreen, true);
  window.addEventListener('pointerup', function (e) { if (e.pointerType === 'touch') fullscreen(); }, true);
  // No pinch zoom, double-tap zoom, long-press menu or text selection over the game.
  document.addEventListener('gesturestart', function (e) { e.preventDefault(); });
  document.addEventListener('contextmenu', function (e) { e.preventDefault(); });
  document.addEventListener('dblclick', function (e) { e.preventDefault(); }, { passive: false });
</script>
{{{ SCRIPT }}}
</body>
</html>
